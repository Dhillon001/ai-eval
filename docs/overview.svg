<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How ai-eval works</title>
  <desc id="desc">Four steps: write test cases in JSONL, run them through your AI system with an adapter, score every answer with scorers, and compare runs to catch regressions in CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.33" stop-color="#a78bfa"/>
      <stop offset="0.66" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #94a3b8; }
      .step { font-size: 19px; font-weight: 700; }
      .tag { font-size: 13px; fill: #94a3b8; }
      .code { font-size: 13px; fill: #cbd5e1; }
      .key { fill: #93c5fd; }
      .str { fill: #fcd34d; }
      .chip { font-size: 14px; font-weight: 600; }
      .small { font-size: 13px; fill: #94a3b8; }
      .row { font-size: 14px; }
      .num { font-size: 14px; font-weight: 700; }
      .panel { fill: #111827; fill-opacity: 0.85; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>

  <!-- heading -->
  <text class="t h1" x="600" y="54" text-anchor="middle">How ai-eval works</text>
  <text class="t sub" x="600" y="82" text-anchor="middle">Test cases in → your AI system → every answer scored → regressions blocked before merge</text>
  <rect x="300" y="98" width="600" height="3" rx="1.5" fill="url(#flow)"/>

  <!-- ============ 1. Test cases ============ -->
  <rect class="panel" x="30" y="124" width="255" height="330" rx="14" stroke="#60a5fa"/>
  <circle cx="60" cy="156" r="15" fill="#60a5fa"/>
  <text class="t" x="60" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" style="fill:#0f172a">1</text>
  <text class="t step" x="84" y="162">Write test cases</text>
  <text class="t tag m" x="48" y="190">datasets/*.jsonl</text>
  <rect x="46" y="204" width="223" height="166" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text class="t m code" x="58" y="228">{</text>
  <text class="t m code" x="70" y="248"><tspan class="key">"input"</tspan>:</text>
  <text class="t m code" x="82" y="266"><tspan class="str">"Can I return a</tspan></text>
  <text class="t m code" x="82" y="284"><tspan class="str"> final-sale jacket?"</tspan>,</text>
  <text class="t m code" x="70" y="304"><tspan class="key">"checks"</tspan>: [<tspan class="str">"cannot"</tspan>],</text>
  <text class="t m code" x="70" y="324"><tspan class="key">"expected_doc_ids"</tspan>:</text>
  <text class="t m code" x="82" y="342">[<tspan class="str">"final-sale"</tspan>]</text>
  <text class="t m code" x="58" y="360">}</text>
  <text class="t small" x="48" y="398">Questions, context, expected</text>
  <text class="t small" x="48" y="417">answers, docs and tool calls.</text>
  <text class="t small" x="48" y="436">Written once, re-run forever.</text>

  <!-- arrow 1→2 -->
  <line x1="289" y1="289" x2="319" y2="289" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 2. Adapter ============ -->
  <rect class="panel" x="325" y="124" width="255" height="330" rx="14" stroke="#a78bfa"/>
  <circle cx="355" cy="156" r="15" fill="#a78bfa"/>
  <text class="t" x="355" y="161" text-anchor="middle" font-size="15" font-weight="700" style="fill:#0f172a">2</text>
  <text class="t step" x="379" y="162">Run your AI system</text>
  <text class="t tag" x="343" y="190">adapter</text>

  <rect x="343" y="204" width="219" height="34" rx="17" fill="#312e81" stroke="#a78bfa"/>
  <text class="t chip" x="452" y="226" text-anchor="middle">OpenAI · compatible APIs</text>
  <rect x="343" y="246" width="219" height="34" rx="17" fill="#312e81" stroke="#a78bfa"/>
  <text class="t chip" x="452" y="268" text-anchor="middle">Anthropic Claude</text>
  <rect x="343" y="288" width="219" height="34" rx="17" fill="#312e81" stroke="#a78bfa"/>
  <text class="t chip" x="452" y="310" text-anchor="middle">Your RAG / agent HTTP API</text>
  <rect x="343" y="330" width="219" height="34" rx="17" fill="#1f2937" stroke="#64748b" stroke-dasharray="5 4"/>
  <text class="t chip" x="452" y="352" text-anchor="middle" style="fill:#cbd5e1">Mock · offline &amp; free</text>

  <text class="t small" x="343" y="398">Captures the answer plus a trace:</text>
  <text class="t small" x="343" y="417">docs retrieved, tool calls,</text>
  <text class="t small" x="343" y="436">tokens, latency, retries.</text>

  <!-- arrow 2→3 -->
  <line x1="584" y1="289" x2="614" y2="289" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 3. Scorers ============ -->
  <rect class="panel" x="620" y="124" width="255" height="330" rx="14" stroke="#34d399"/>
  <circle cx="650" cy="156" r="15" fill="#34d399"/>
  <text class="t" x="650" y="161" text-anchor="middle" font-size="15" font-weight="700" style="fill:#0f172a">3</text>
  <text class="t step" x="674" y="162">Score every answer</text>
  <text class="t tag" x="638" y="190">scorers</text>

  <!-- pass rows -->
  <g>
    <rect x="638" y="204" width="219" height="36" rx="8" fill="#052e2b"/>
    <circle cx="658" cy="222" r="9" fill="#34d399"/>
    <path d="M653.5 222 l3 3 l6 -6" stroke="#052e2b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t row" x="675" y="227">checklist</text>
    <text class="t num" x="845" y="227" text-anchor="end" style="fill:#6ee7b7">1.00</text>

    <rect x="638" y="246" width="219" height="36" rx="8" fill="#052e2b"/>
    <circle cx="658" cy="264" r="9" fill="#34d399"/>
    <path d="M653.5 264 l3 3 l6 -6" stroke="#052e2b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t row" x="675" y="269">LLM judge · faithful</text>
    <text class="t num" x="845" y="269" text-anchor="end" style="fill:#6ee7b7">0.92</text>

    <rect x="638" y="288" width="219" height="36" rx="8" fill="#052e2b"/>
    <circle cx="658" cy="306" r="9" fill="#34d399"/>
    <path d="M653.5 306 l3 3 l6 -6" stroke="#052e2b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t row" x="675" y="311">agent tool calls</text>
    <text class="t num" x="845" y="311" text-anchor="end" style="fill:#6ee7b7">1.00</text>

    <rect x="638" y="330" width="219" height="36" rx="8" fill="#3b0d14"/>
    <circle cx="658" cy="348" r="9" fill="#f87171"/>
    <path d="M654 344 l8 8 M662 344 l-8 8" stroke="#3b0d14" stroke-width="2.4" stroke-linecap="round"/>
    <text class="t row" x="675" y="353">retrieval recall@3</text>
    <text class="t num" x="845" y="353" text-anchor="end" style="fill:#fca5a5">0.50</text>
  </g>

  <text class="t small" x="638" y="398">Exact, checklist, LLM-as-judge,</text>
  <text class="t small" x="638" y="417">RAG faithfulness, retrieval and</text>
  <text class="t small" x="638" y="436">agent-trajectory scorers.</text>

  <!-- arrow 3→4 -->
  <line x1="879" y1="289" x2="909" y2="289" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 4. Compare / CI ============ -->
  <rect class="panel" x="915" y="124" width="255" height="330" rx="14" stroke="#fbbf24"/>
  <circle cx="945" cy="156" r="15" fill="#fbbf24"/>
  <text class="t" x="945" y="161" text-anchor="middle" font-size="15" font-weight="700" style="fill:#0f172a">4</text>
  <text class="t step" x="969" y="162">Catch regressions</text>
  <text class="t tag" x="933" y="190">compare · CI gate</text>

  <!-- before / after -->
  <rect x="933" y="204" width="102" height="72" rx="10" fill="#0b1220" stroke="#1f2a44"/>
  <text class="t tag" x="984" y="226" text-anchor="middle">main</text>
  <text class="t" x="984" y="259" text-anchor="middle" font-size="26" font-weight="700" style="fill:#6ee7b7">100%</text>
  <line x1="1039" y1="240" x2="1061" y2="240" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1066" y="204" width="86" height="72" rx="10" fill="#0b1220" stroke="#7f1d1d"/>
  <text class="t tag" x="1109" y="226" text-anchor="middle">your PR</text>
  <text class="t" x="1109" y="259" text-anchor="middle" font-size="26" font-weight="700" style="fill:#fca5a5">92%</text>

  <!-- verdict -->
  <rect x="933" y="288" width="219" height="36" rx="18" fill="#7f1d1d" stroke="#f87171"/>
  <text class="t chip" x="1042" y="311" text-anchor="middle" style="fill:#fee2e2">2 regressions · merge blocked</text>

  <!-- run stats -->
  <rect x="933" y="334" width="219" height="32" rx="8" fill="#1f2937"/>
  <text class="t m" x="1042" y="355" text-anchor="middle" font-size="12.5" style="fill:#fcd34d">cost $0.04 · p95 latency 1.2s</text>

  <text class="t small" x="933" y="398">Every run saved with cost and</text>
  <text class="t small" x="933" y="417">an HTML report; compare exits 1</text>
  <text class="t small" x="933" y="436">so GitHub Actions fails the PR.</text>

  <!-- feedback loop: 4 back to 1 -->
  <path d="M1042 456 C1042 505, 1042 505, 1000 505 L200 505 C157 505, 157 505, 157 462" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowMuted)"/>
  <rect x="440" y="491" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
  <text class="t" x="600" y="510" text-anchor="middle" font-size="14" style="fill:#cbd5e1">fix the prompt, model or retriever → re-run</text>

  <text class="t" x="600" y="545" text-anchor="middle" font-size="12.5" style="fill:#64748b">Illustrative numbers. Runs fully offline with the mock adapter.</text>
</svg>

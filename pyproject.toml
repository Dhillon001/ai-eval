[project]
name = "ai-eval"
version = "0.1.0"
description = "Offline evaluation runner for LLM and AI systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ai-eval = "ai_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_eval"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_eval" = "ai_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

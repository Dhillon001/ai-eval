name: Release tag

# Creates the vX.Y.Z tag and a GitHub Release whenever the version in
# pyproject.toml is new. Tags are made by CI so no local git setup is needed.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release-tag.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create tag and release if new
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already tagged"; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"
          awk -v v="$V" '$0 ~ "^## .*"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then
            gh release create "v$V" --title "v$V" --notes-file notes.md
          else
            gh release create "v$V" --title "v$V" --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

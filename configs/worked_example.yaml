name: shop-support-rag-v1
description: Worked example - a store support bot, scored on retrieval, answer content and tool calls
dataset: datasets/examples/worked_example.jsonl
adapter:
  type: mock
  template: "Acme Support: Items can be returned within 30 days of delivery. Standard shipping takes 3-5 business days. (You asked: {input})"
scorers:
  - type: checklist
  - type: retrieval
    metric: recall@3
  - type: retrieval
    metric: mrr
    threshold: 0.5
  - type: trajectory
    mode: subset
    match_args: true
